name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 1.0.0），留空则使用当前 ref'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # 原始 ipa 下载地址：优先仓库变量 ORIGINAL_IPA_URL，其次机密 ORIGINAL_IPA_URL
      # 如链接需要认证，可在机密 IPA_URL_HEADER 中配置完整请求头（如 "Authorization: Bearer xxx"）
      ORIGINAL_IPA_URL: ${{ vars.ORIGINAL_IPA_URL || secrets.ORIGINAL_IPA_URL }}
      IPA_URL_HEADER: ${{ secrets.IPA_URL_HEADER }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MonkeyDev-Next
        run: |
          git clone --depth 1 https://github.com/kshipeng/MonkeyDev-Next.git /tmp/monkeydev-next
          mkdir -p "$HOME/.MonkeyDev"
          for dir in bin Tools include Resource Librarys Frameworks MFrameworks; do
            [ -d "/tmp/monkeydev-next/$dir" ] && cp -rf "/tmp/monkeydev-next/$dir" "$HOME/.MonkeyDev/"
          done
          chmod +x "$HOME/.MonkeyDev"/bin/* "$HOME/.MonkeyDev"/Tools/* 2>/dev/null || true

      - name: Cache Theos
        uses: actions/cache@v4
        id: theos
        with:
          path: ~/.MonkeyDev/theos
          key: theos-macos-v1

      - name: Install Theos
        run: |
          if [ ! -f "$HOME/.MonkeyDev/theos/bin/logos.pl" ]; then
            rm -rf "$HOME/.MonkeyDev/theos"
            git clone --recursive https://github.com/theos/theos.git "$HOME/.MonkeyDev/theos"
          fi
          echo "$HOME/.MonkeyDev/theos/bin" >> "$GITHUB_PATH"
          echo "$HOME/.MonkeyDev/bin" >> "$GITHUB_PATH"

      - name: Download original Weibo ipa
        run: |
          mkdir -p WeiboMApp/TargetApp
          if [ -n "$ORIGINAL_IPA_URL" ]; then
            echo "使用环境变量指定的下载链接..."
            if [ -n "$IPA_URL_HEADER" ]; then
              curl -fSL --retry 3 -H "$IPA_URL_HEADER" -o WeiboMApp/TargetApp/original.ipa "$ORIGINAL_IPA_URL"
            else
              curl -fSL --retry 3 -o WeiboMApp/TargetApp/original.ipa "$ORIGINAL_IPA_URL"
            fi
          else
            echo "未配置 ORIGINAL_IPA_URL，回退从仓库 Release 下载 WeiboOverseas_*_original.ipa ..."
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'WeiboOverseas_*_original.ipa' --dir /tmp/ipa_dl
            cp /tmp/ipa_dl/WeiboOverseas_*_original.ipa WeiboMApp/TargetApp/original.ipa
          fi
          ls -la WeiboMApp/TargetApp/

      - name: Build
        run: |
          xcodebuild -project WeiboMApp.xcodeproj -scheme WeiboMApp \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Create ipa
        run: |
          chmod +x LatestBuild/createIPA.command
          (cd LatestBuild && ./createIPA.command)

      - name: Create tweak packages
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TWEAK_VERSION="$TAG" ./createTweakPackages.command

      - name: Create GitHub Release
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            LatestBuild/TweakPackages/*
